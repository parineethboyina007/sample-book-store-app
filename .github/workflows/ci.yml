name: BookStore CI

on:
  push:
    branches:
      - devops-from-scratch
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bookstore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bookstore-frontend-react-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: bookstore-frontend-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build backend modules and run tests
        run: mvn --batch-mode --no-transfer-progress -Ddockerfile.skip=true verify
